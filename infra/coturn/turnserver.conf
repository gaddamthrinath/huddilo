# Local development configuration. The secret itself stays in .env and is
# supplied as a command-line value by Docker Compose.
log-file=stdout
log-min-level=warning

listening-port=3478
min-port=49160
max-port=49200

# TURN REST shared-secret authentication. Coturn accepts temporary credentials
# generated by our backend and rejects anonymous relay allocations.
use-auth-secret
fingerprint
no-multicast-peers

# Local development intentionally has no TLS certificate.
no-tls
